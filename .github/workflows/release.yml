name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustc -vV | grep -Fx "host: $TARGET"
      - name: Build and test
        shell: bash
        run: |
          cargo test --release --locked
          cargo build --release --locked
      - name: Package portable CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/package/defs"
          cp target/release/sarai README.md LICENSE "$RUNNER_TEMP/package/"
          cp defs/example.toml "$RUNNER_TEMP/package/defs/"
          tar -C "$RUNNER_TEMP/package" -czf "sarai-$TARGET.tar.gz" sarai README.md LICENSE defs
      - name: Package portable CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1 -Offline
      - uses: actions/upload-artifact@v4
        with:
          name: sarai-${{ matrix.target }}
          path: |
            sarai-${{ matrix.target }}.tar.gz
            dist/sarai-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Sarai $TAG" --generate-notes
          find dist -type f -exec gh release upload "$TAG" {} --clobber \;
