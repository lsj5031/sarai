name: Sarai

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustc -vV | grep -Fx "host: $TARGET"
      - name: Build and test
        run: |
          cargo test --release --locked
          cargo build --release --locked
      - name: Package portable CLI
        run: |
          mkdir -p "$RUNNER_TEMP/package/defs"
          cp target/release/sarai README.md LICENSE "$RUNNER_TEMP/package/"
          cp defs/example.toml "$RUNNER_TEMP/package/defs/"
          tar -C "$RUNNER_TEMP/package" -czf "sarai-$TARGET.tar.gz" sarai README.md LICENSE defs
      - name: Test extracted executable
        run: |
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "sarai-$TARGET.tar.gz" -C "$RUNNER_TEMP/extracted"
          (cd "$RUNNER_TEMP/extracted" && ./sarai --list && ./sarai --dry-run)
      - uses: actions/upload-artifact@v4
        with:
          name: sarai-${{ matrix.target }}
          path: sarai-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  windows:
    name: x86_64-pc-windows-msvc
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustc -vV | grep -Fx "host: x86_64-pc-windows-msvc"
      - name: Build and test
        shell: bash
        run: |
          cargo test --release --locked
          cargo build --release --locked
      - name: Package portable CLI
        shell: pwsh
        run: ./scripts/package.ps1 -Offline
      - name: Test extracted executable
        shell: pwsh
        run: |
          Expand-Archive dist/sarai-x86_64-pc-windows-msvc.zip -DestinationPath extracted
          Push-Location extracted
          ./sarai.exe --list
          ./sarai.exe --dry-run
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: sarai-x86_64-pc-windows-msvc
          path: dist/sarai-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
