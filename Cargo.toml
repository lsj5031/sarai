[package]
name = "sarai"
version = "0.2.0"
edition = "2024"
description = "Point coding agents at your own provider and models by editing their config files."
repository = "https://github.com/lsj5031/sarai"
readme = "README.md"
license = "MIT"
publish = false

[[bin]]
name = "sarai"
path = "src/main.rs"

[dependencies]
anyhow = "1"
glob = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tempfile = "3"
toml = { version = "1.1", features = ["preserve_order"] }
toml_edit = { version = "0.25", features = ["serde"] }

[profile.release]
strip = true
